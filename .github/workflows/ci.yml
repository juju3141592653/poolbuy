# Runs the prototype's checks on every push and pull request that touches /app.
name: PoolBuy app checks

on:
  push:
    paths: ['app/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['app/**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Security check 5: fail on high-severity issues in what users actually download
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
